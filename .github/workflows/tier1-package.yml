name: Tier 1 package qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EFFECTGATE_PREVIOUS_COMMIT: 7d210e289bc0c0b393e0fae1c8221a0f4f07195c

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: Windows x64
            runner: windows-2025
          - name: macOS x64
            runner: macos-15-intel
    steps:
      - name: Check out current package
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: current
          persist-credentials: false

      - name: Check out previous package
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EFFECTGATE_PREVIOUS_COMMIT }}
          path: previous
          persist-credentials: false

      - name: Use exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Record toolchain
        working-directory: current/poc
        run: |
          node --version
          npm --version

      - name: Qualify current and previous packages
        working-directory: current/poc
        env:
          EFFECTGATE_PREVIOUS_PACKAGE: ${{ github.workspace }}/previous/poc
        run: npm test
