name: Tier 1 release reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            name: Linux x64
            runner: ubuntu-24.04
          - id: linux-arm64
            name: Linux arm64
            runner: ubuntu-24.04-arm
          - id: windows-x64
            name: Windows x64
            runner: windows-2025
          - id: macos-arm64
            name: macOS arm64
            runner: macos-15
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Build source-bound release bundle
        working-directory: poc
        run: npm run release:bundle -- --output ../release-bundle --source-commit ${{ github.sha }}

      - name: Upload release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: effectgate-release-${{ matrix.id }}-${{ github.sha }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare release bundles
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: effectgate-release-*-${{ github.sha }}
          path: release-candidates

      - name: Verify exact cross-platform reproducibility
        run: node poc/src/release/release-compare.mjs --input release-candidates --source-commit ${{ github.sha }} > release-qualification.json

      - name: Print release qualification
        run: node -e "process.stdout.write(require('node:fs').readFileSync('release-qualification.json'))"

      - name: Upload release qualification
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: effectgate-release-qualification-${{ github.sha }}
          path: release-qualification.json
          if-no-files-found: error
          retention-days: 30
